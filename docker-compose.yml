services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: smartphone-product-manager-app
    container_name: spm_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spm_network

  web:
    image: nginx:alpine
    container_name: spm_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - spm_network

  db:
    image: postgres:16-alpine
    container_name: spm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - spm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-laravel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spm_network

networks:
  spm_network:
    driver: bridge

volumes:
  spm_db_data:
